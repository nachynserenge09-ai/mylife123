<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Планер дня</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #ffffff; --text: #000000; --hint: #8a8a8e; --link: #2481cc;
      --btn: #2481cc; --btn-text: #ffffff; --secondary-bg: #f1f1f4;
    }
    html, body { background: var(--secondary-bg); color: var(--text); -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .ring-fill { transition: stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); }
    .card { background: var(--bg); }
    .done-text { color: var(--hint); text-decoration: line-through; text-decoration-thickness: 2px; }
    .pop { animation: pop .28s cubic-bezier(.2,.9,.3,1.2); }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
    .tab[aria-selected="true"] { background: var(--bg); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--btn); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .ring-fill { transition: none; } .pop { animation: none; } }
  </style>
</head>
<body class="min-h-screen">
  <canvas id="confetti" class="pointer-events-none fixed inset-0 z-50"></canvas>

  <main class="mx-auto max-w-md px-4 pt-6 pb-12">

    <!-- Шапка: дата + кольцо прогресса -->
    <header class="flex items-center justify-between gap-4">
      <div class="min-w-0">
        <p id="greeting" class="text-sm" style="color: var(--hint)">&nbsp;</p>
        <h1 id="day" class="text-6xl font-extrabold leading-none tracking-tight tabular-nums">&nbsp;</h1>
        <p id="month" class="mt-1 text-lg font-medium first-letter:uppercase">&nbsp;</p>
        <p id="summary" class="mt-3 text-sm" style="color: var(--hint)">Загрузка…</p>
      </div>

      <div class="relative h-32 w-32 shrink-0" role="progressbar" id="bar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <svg viewBox="0 0 100 100" class="h-full w-full -rotate-90">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" style="stop-color: var(--btn)"/>
              <stop offset="1" style="stop-color: var(--link)"/>
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="42" fill="none" stroke-width="10" style="stroke: var(--bg)"/>
          <circle id="ring" class="ring-fill" cx="50" cy="50" r="42" fill="none" stroke-width="10"
                  stroke-linecap="round" stroke="url(#g)" stroke-dasharray="263.9" stroke-dashoffset="263.9"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span id="ring-main" class="text-3xl font-bold tabular-nums leading-none">0</span>
          <span id="ring-sub" class="mt-1 text-xs" style="color: var(--hint)">из 0</span>
        </div>
      </div>
    </header>

    <!-- Добавление -->
    <form id="add-form" class="card mt-6 flex items-center gap-2 rounded-2xl p-2" autocomplete="off">
      <input id="new-task" type="text" maxlength="200" placeholder="Что нужно сделать сегодня?"
             aria-label="Новая задача"
             class="min-w-0 flex-1 bg-transparent px-3 py-2 text-base placeholder:opacity-60 focus:outline-none"
             style="color: var(--text)">
      <button type="submit" aria-label="Добавить задачу"
              class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl active:opacity-80"
              style="background: var(--btn); color: var(--btn-text)">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </form>

    <p id="error" class="mt-3 hidden text-sm text-red-500" role="alert"></p>

    <!-- Фильтры -->
    <div id="tabs" role="tablist" class="mt-5 flex rounded-xl p-1 text-sm" style="background: color-mix(in srgb, var(--hint) 18%, transparent)">
      <button class="tab flex-1 rounded-lg py-1.5" role="tab" data-f="all" aria-selected="true">Все</button>
      <button class="tab flex-1 rounded-lg py-1.5" role="tab" data-f="active" aria-selected="false">Осталось</button>
      <button class="tab flex-1 rounded-lg py-1.5" role="tab" data-f="done" aria-selected="false">Готово</button>
    </div>

    <ul id="list" class="mt-3"></ul>
    <p id="empty" class="mt-10 hidden text-center text-sm" style="color: var(--hint)"></p>

    <button id="clear" type="button" class="mt-3 hidden w-full rounded-xl py-3 text-sm font-medium active:opacity-70"
            style="color: var(--link)"></button>
  </main>

<script>
(() => {
  const tg = window.Telegram?.WebApp;
  const $ = (id) => document.getElementById(id);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const CIRC = 263.9;
  const els = {
    greeting: $('greeting'), day: $('day'), month: $('month'), summary: $('summary'),
    ring: $('ring'), ringMain: $('ring-main'), ringSub: $('ring-sub'), bar: $('bar'),
    form: $('add-form'), input: $('new-task'), list: $('list'), empty: $('empty'),
    error: $('error'), tabs: $('tabs'), clear: $('clear'),
  };
  let tasks = [];
  let filter = 'all';
  let justAddedId = null;

  /* ---------- Тема Telegram ---------- */
  function applyTheme() {
    const p = tg?.themeParams || {};
    const root = document.documentElement.style;
    const map = {
      '--bg': p.section_bg_color || p.bg_color, '--text': p.text_color, '--hint': p.hint_color,
      '--link': p.link_color, '--btn': p.button_color, '--btn-text': p.button_text_color,
      '--secondary-bg': p.secondary_bg_color,
    };
    for (const [k, v] of Object.entries(map)) if (v) root.setProperty(k, v);
    root.colorScheme = tg?.colorScheme || 'light';
    tg?.setHeaderColor?.('secondary_bg_color');
    tg?.setBackgroundColor?.('secondary_bg_color');
  }

  /* ---------- API ---------- */
  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg?.initData || '', ...options.headers },
    });
    if (!res.ok) throw new Error(res.status === 401 ? 'auth' : 'http ' + res.status);
    return res.status === 204 ? null : res.json();
  }
  const showError = (msg) => { els.error.textContent = msg; els.error.classList.toggle('hidden', !msg); };

  /* ---------- Конфетти ---------- */
  function confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = $('confetti'), x = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight;
    const cols = [css('--btn'), css('--link'), '#f5b83d', '#ef6f6c', '#4cc38a'];
    const ps = Array.from({ length: 90 }, () => ({
      x: innerWidth / 2, y: innerHeight * 0.28, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 12 - 4,
      s: Math.random() * 6 + 5, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
      c: cols[(Math.random() * cols.length) | 0],
    }));
    let f = 0;
    (function tick() {
      x.clearRect(0, 0, c.width, c.height);
      for (const p of ps) {
        p.vy += 0.4; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c;
        x.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); x.restore();
      }
      if (++f < 110) requestAnimationFrame(tick); else x.clearRect(0, 0, c.width, c.height);
    })();
  }

  /* ---------- Отрисовка ---------- */
  const stats = () => {
    const total = tasks.length, done = tasks.filter((t) => t.is_completed).length;
    return { total, done, left: total - done, pct: total ? Math.round((done / total) * 100) : 0 };
  };
  const allDone = () => { const s = stats(); return s.total > 0 && s.left === 0; };

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? few : many;
  }

  function render() {
    const { total, done, left, pct } = stats();

    els.ring.style.strokeDashoffset = CIRC * (1 - pct / 100);
    els.bar.setAttribute('aria-valuenow', pct);
    els.ringMain.textContent = total ? pct + '%' : '–';
    els.ringSub.textContent = total ? `${done} из ${total}` : 'нет задач';
    els.summary.textContent = !total ? 'Начните с одной задачи'
      : left === 0 ? 'День закрыт. Отличная работа!'
      : `Осталось ${left} ${plural(left, 'задача', 'задачи', 'задач')}`;

    const visible = tasks.filter((t) => filter === 'all' || (filter === 'done') === t.is_completed);
    els.list.replaceChildren(...visible.map(renderTask));
    justAddedId = null;

    const emptyText = !total ? 'На сегодня задач нет. Добавьте первую в поле выше.'
      : !visible.length ? (filter === 'done' ? 'Пока ничего не выполнено.' : 'Всё выполнено.') : '';
    els.empty.textContent = emptyText;
    els.empty.classList.toggle('hidden', !emptyText);

    els.clear.classList.toggle('hidden', !(done > 0 && filter !== 'active'));
    els.clear.textContent = `Удалить выполненные (${done})`;
  }

  function renderTask(t) {
    const li = document.createElement('li');
    li.className = 'card mb-2 flex items-center gap-3 rounded-2xl px-4 py-3' + (t.id === justAddedId ? ' pop' : '');

    const check = document.createElement('button');
    check.type = 'button';
    check.setAttribute('role', 'checkbox');
    check.setAttribute('aria-checked', t.is_completed);
    check.setAttribute('aria-label', 'Отметить выполненной');
    check.className = 'flex h-7 w-7 shrink-0 items-center justify-center rounded-full';
    check.style.border = '2px solid ' + (t.is_completed ? 'var(--btn)' : 'var(--hint)');
    check.style.background = t.is_completed ? 'var(--btn)' : 'transparent';
    if (t.is_completed) {
      check.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5l3 3 6-7" stroke="var(--btn-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
    check.addEventListener('click', () => toggle(t));

    const span = document.createElement('span');
    span.className = 'min-w-0 flex-1 break-words text-base' + (t.is_completed ? ' done-text' : '');
    span.textContent = t.text;

    const del = document.createElement('button');
    del.type = 'button';
    del.setAttribute('aria-label', 'Удалить задачу');
    del.className = 'flex h-9 w-9 shrink-0 items-center justify-center rounded-full active:opacity-60';
    del.style.color = 'var(--hint)';
    del.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    del.addEventListener('click', () => remove(t));

    li.append(check, span, del);
    return li;
  }

  const celebrateIfNeeded = (wasDone) => {
    if (!wasDone && allDone()) { confetti(); tg?.HapticFeedback?.notificationOccurred('success'); }
  };

  /* ---------- Действия ---------- */
  async function toggle(t) {
    const wasDone = allDone(), prev = t.is_completed;
    t.is_completed = !prev;
    render();
    tg?.HapticFeedback?.impactOccurred('light');
    celebrateIfNeeded(wasDone);
    try {
      await api(`/api/tasks/${t.id}`, { method: 'PATCH', body: JSON.stringify({ is_completed: t.is_completed }) });
      showError('');
    } catch {
      t.is_completed = prev; render();
      showError('Не удалось сохранить. Проверьте соединение и попробуйте снова.');
    }
  }

  async function remove(t) {
    const wasDone = allDone(), idx = tasks.indexOf(t);
    tasks.splice(idx, 1); render();
    tg?.HapticFeedback?.impactOccurred('medium');
    celebrateIfNeeded(wasDone);
    try { await api(`/api/tasks/${t.id}`, { method: 'DELETE' }); showError(''); }
    catch { tasks.splice(idx, 0, t); render(); showError('Не удалось удалить задачу. Попробуйте снова.'); }
  }

  els.clear.addEventListener('click', async () => {
    const doneTasks = tasks.filter((t) => t.is_completed);
    const backup = tasks.slice();
    tasks = tasks.filter((t) => !t.is_completed); render();
    try { await Promise.all(doneTasks.map((t) => api(`/api/tasks/${t.id}`, { method: 'DELETE' }))); showError(''); }
    catch { tasks = backup; render(); showError('Не удалось удалить выполненные. Попробуйте снова.'); }
  });

  els.form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = els.input.value.trim();
    if (!text) return;
    els.input.value = '';
    try {
      const t = await api('/api/tasks', { method: 'POST', body: JSON.stringify({ text }) });
      tasks.push(t); justAddedId = t.id;
      if (filter === 'done') setFilter('all'); else render();
      showError('');
      tg?.HapticFeedback?.impactOccurred('light');
    } catch {
      els.input.value = text;
      showError('Не удалось добавить задачу. Попробуйте снова.');
    }
  });

  function setFilter(f) {
    filter = f;
    els.tabs.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', b.dataset.f === f));
    render();
  }
  els.tabs.addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (b) setFilter(b.dataset.f); });

  /* ---------- Старт ---------- */
  function setHeader(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    els.day.textContent = d;
    els.month.textContent = date.toLocaleDateString('ru-RU', { month: 'long', weekday: 'long' });
    const h = new Date().getHours();
    const hello = h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';
    const name = tg?.initDataUnsafe?.user?.first_name;
    els.greeting.textContent = name ? `${hello}, ${name}` : hello;
  }

  async function init() {
    if (!tg || !tg.initData) {
      els.day.textContent = 'Планер';
      els.summary.textContent = 'Откройте приложение через Telegram-бота.';
      els.form.classList.add('hidden'); els.tabs.classList.add('hidden');
      return;
    }
    tg.ready(); tg.expand();
    applyTheme();
    tg.onEvent('themeChanged', applyTheme);
    try {
      const data = await api('/api/tasks');
      setHeader(data.date);
      tasks = data.tasks;
      render();
    } catch (err) {
      els.day.textContent = 'Планер';
      els.summary.textContent = '';
      showError(err.message === 'auth'
        ? 'Не удалось подтвердить вас в Telegram. Закройте и откройте приложение заново.'
        : 'Не удалось загрузить задачи. Проверьте соединение и откройте приложение заново.');
    }
  }
  init();
})();
</script>
</body>
</html>
